name: ci

# Baton's gate: the type check and the whole suite (unit tests and the S-BTN integration
# scenarios, BATON_SPEC §13a) on every pull request and on main. docs is private, so this job
# cannot see it: the vendored library and the board fixtures are checked against their
# manifest and recorded shas here, and against docs itself wherever an agent runs the suite
# beside a docs checkout (R-BTN-37). Deploying is R3-1207's workflow, not this one.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The formal model of Baton's core (R3-1243, BATON_SPEC R-BTN-68): the fast checks
  # (typecheck, regression runs, simulation, witnesses), model-drawn traces driving the core
  # (R3-1244), and Apalache's bounded proof of the safety invariants. Apalache needs a JVM.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run model          # the item's 10,000 samples; npm test runs 1,000
      # R3-1244: more model-drawn traces driving the core than npm test's 200
      - run: REPLAY_TRACES=1000 npx vitest run --project local test/model/replay.test.ts
      - run: npm run model:verify
