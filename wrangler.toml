# Baton — BATON_SPEC §3. One Worker, one SQLite Durable Object (`Baton`, fixed name).
name = "baton"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-09-01"
routes = [{ pattern = "baton.immediately.run/*", zone_name = "immediately.run" }]

[[durable_objects.bindings]]
name = "BATON"
class_name = "Baton"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Baton"]

# The schema migrations, the dashboard page and its stylesheet are bundled as text; the
# dashboard's one ES module too (it is served to the browser, never imported by the Worker).
[[rules]]
type = "Text"
globs = ["**/*.sql", "**/*.html", "**/*.css", "**/ui/*.js"]
fallthrough = false

[vars]
BATON_ORIGIN = "https://baton.immediately.run"
# R-BTN-15: the sync principal — GitHub Actions OIDC. Which repository a token acts for, and
# that its workflow is that repository's sync or mirror on its default branch, Baton reads from
# its registry (R-BTN-47), seeded here at start, insert-only, until R3-1240's admin route.
OIDC_ISSUER = "https://token.actions.githubusercontent.com"
OIDC_JWKS_URL = "https://token.actions.githubusercontent.com/.well-known/jwks"
BATON_REPOSITORIES = '[{"id":"docs","github":"immediately-run/docs","default_branch":"main","sync_workflow":".github/workflows/baton-sync.yml","mirror_workflow":".github/workflows/baton-mirror.yml","transcript_repos":["immediately-run/claude-sessions","immediately-run-worker/session-transcripts"]}]'
# R-BTN-16: the owner principal — Cloudflare Access. Set by the owner in R3-1208.
ACCESS_TEAM_DOMAIN = "mute-dew-600d.cloudflareaccess.com"
ACCESS_AUD = "326d8bf228bb8472d48a681888ae117f378e1182618c1d5e3f9e7d00e3b6e94d"
OWNER_EMAILS = "neumark.peter@gmail.com"

# The staging Worker (BATON_SPEC §13a): its own Durable Object namespace, at its own hostname on
# the same zone, deployed beside production by baton-deploy.yml. Bindings and vars are not
# inherited from the top level, so they are repeated here. R3-1208 adds the DNS record and an
# Access application for the hostname.
[env.staging]
name = "baton-staging"
routes = [{ pattern = "baton-staging.immediately.run/*", zone_name = "immediately.run" }]

[[env.staging.durable_objects.bindings]]
name = "BATON"
class_name = "Baton"

[env.staging.vars]
BATON_ORIGIN = "https://baton-staging.immediately.run"
OIDC_ISSUER = "https://token.actions.githubusercontent.com"
OIDC_JWKS_URL = "https://token.actions.githubusercontent.com/.well-known/jwks"
BATON_REPOSITORIES = '[{"id":"docs","github":"immediately-run/docs","default_branch":"main","sync_workflow":".github/workflows/baton-sync.yml","mirror_workflow":".github/workflows/baton-mirror.yml","transcript_repos":["immediately-run/claude-sessions","immediately-run-worker/session-transcripts"]}]'
ACCESS_TEAM_DOMAIN = "mute-dew-600d.cloudflareaccess.com"
ACCESS_AUD = "d572b8ea4e7600d0bef9116fa481d5e70505a2844c1f32b44535b45ba8875959"
OWNER_EMAILS = "neumark.peter@gmail.com"
